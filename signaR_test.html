<!DOCTYPE html>
<html>
<head>
    <title>SignalR Chat Test</title>
</head>

<body>

<h2>SignalR Chat Test</h2>

<input id="token" placeholder="JWT token" style="width:500px" />
<br><br>

<button onclick="connect()">Connect</button>

<br><br>

<input id="receiverId" placeholder="Receiver ID" style="width:400px" />
<br><br>

<input id="message" placeholder="Message" />
<button onclick="sendMessage()">Send</button>

<h3>Messages</h3>

<pre id="messages"></pre>

<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.0/dist/browser/signalr.min.js"></script>

<script>

let connection;

async function connect() {

    const token = document.getElementById("token").value;

    connection = new signalR.HubConnectionBuilder()
        .withUrl("https://localhost:xxxx/hubs/chat", {
            accessTokenFactory: () => token
        })
        .withAutomaticReconnect()
        .build();

    connection.on("ReceiveMessage", message => {

        document.getElementById("messages").textContent +=
            `From: ${message.senderId}\n` +
            `Chat: ${message.chatId}\n` +
            `Message: ${message.content}\n` +
            `Time: ${message.sentAt}\n\n`;
    });

    try {

        await connection.start();

        console.log("Connected!");

    } catch (err) {

        console.error(err);
    }
}

async function sendMessage() {

    const receiverId =
        document.getElementById("receiverId").value;

    const message =
        document.getElementById("message").value;

    await connection.invoke(
        "SendPrivateMessage",
        receiverId,
        message
    );
}

</script>

</body>
</html>
